name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (advisory)
        run: cargo clippy --workspace --all-targets || true
      - name: Core and CLI tests
        run: cargo test --workspace --exclude wolfppt-py

  wheel-smoke:
    name: Wheel smoke (${{ matrix.os }} py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380
        with:
          maturin-version: v1.14.1
          manylinux: "2_28"
          args: >-
            --release --locked --out dist
            ${{ matrix.os == 'macos-14' && '--interpreter python' || '--find-interpreter' }}
      - name: Smoke test
        run: |
          python -m pip install wolfppt==0.1.0 --no-index --find-links dist
          python tests/community_wheel_smoke.py

  sdist-build:
    name: sdist builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380
        with:
          maturin-version: v1.14.1
          args: --sdist --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: sdist-check
          path: dist/*.tar.gz
          if-no-files-found: error
