name: Build release artifacts

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  linux-wheels:
    name: Linux ${{ matrix.target }} wheels
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380
        with:
          maturin-version: v1.14.1
          sccache: true
          manylinux: "2_28"
          args: --release --locked --out dist --find-interpreter
      - name: Smoke test one wheel per Python
        run: |
          for wheel in dist/*.whl; do
            tag=$(basename "$wheel" | sed -E 's/.*-(cp3[0-9]+).*/\1/')
            py="${tag#cp}"
            python_bin="$(command -v python3)"
            actual="cp$(python3 -c 'import sys; print(f"{sys.version_info.major}{sys.version_info.minor}")')"
            if [ "$tag" = "$actual" ]; then
              python3 -m pip install "$wheel"
              python3 tests/community_wheel_smoke.py
            else
              echo "skip smoke for $wheel (runner python $actual)"
            fi
          done
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  macos-wheels:
    name: macOS py${{ matrix.python }} wheels
    runs-on: macos-14
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380
        with:
          maturin-version: v1.14.1
          sccache: true
          args: --release --locked --out dist --interpreter python
      - name: Smoke test
        run: |
          python -m pip install wolfppt==0.1.0 --no-index --find-links dist
          python tests/community_wheel_smoke.py
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-arm64-py${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380
        with:
          maturin-version: v1.14.1
          args: --sdist --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [linux-wheels, macos-wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: false
