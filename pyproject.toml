[project]
name = "wolfppt"
version = "0.1.0"
description = "Edit existing PowerPoint .pptx decks from Python with a python-pptx-style API, keeping themes, layouts, and every untouched part byte-for-byte identical. MIT licensed."
readme = "README.md"
keywords = [
  "powerpoint",
  "pptx",
  "pptm",
  "python-pptx",
  "python-pptx-alternative",
  "edit-pptx",
  "presentation",
  "slides",
  "office-automation",
  "reporting",
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Wolfgang Schoenberger" },
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://wolfppt.com"
Repository = "https://github.com/wolfiesch/wolfppt-oss"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "python-pptx>=1.0.2",
]
baseline = [
  "python-pptx>=1.0.2",
]
render = [
  "Pillow>=10.0",
]

[project.scripts]
wolfppt = "wolfppt.demo:main"
wolfppt-harness = "wolfppt.cli:main"

[build-system]
requires = ["maturin>=1.13,<2"]
build-backend = "maturin"

[tool.maturin]
bindings = "pyo3"
manifest-path = "crates/wolfppt-py/Cargo.toml"
python-source = "src"
module-name = "wolfppt.wolfppt_native"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
