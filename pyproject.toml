[project]
name = "wolfppt"
version = "0.1.6"
description = "Create, read, and edit PowerPoint .pptx files in Python. A python-pptx alternative with a python-pptx-style API that keeps themes, layouts, charts, and every untouched part byte-for-byte identical. MIT licensed."
readme = "README.md"
keywords = [
  "powerpoint",
  "pptx",
  "ppt",
  "pptm",
  "python-pptx",
  "python-pptx-alternative",
  "create-pptx",
  "edit-pptx",
  "openxml",
  "office",
  "presentation",
  "slides",
  "office-automation",
  "reporting",
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Wolfgang Schoenberger" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Graphics :: Presentation",
  "Topic :: Office/Business :: Office Suites",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://wolfppt.com"
Documentation = "https://wolfppt.com/python-pptx-migration"
Repository = "https://github.com/wolfiesch/wolfppt-oss"
Issues = "https://github.com/wolfiesch/wolfppt-oss/issues"
Changelog = "https://github.com/wolfiesch/wolfppt-oss/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "python-pptx>=1.0.2",
]
baseline = [
  "python-pptx>=1.0.2",
]
render = [
  "Pillow>=10.0",
]

[project.scripts]
wolfppt = "wolfppt.demo:main"
wolfppt-harness = "wolfppt.cli:main"

[build-system]
requires = ["maturin>=1.13,<2"]
build-backend = "maturin"

[tool.maturin]
bindings = "pyo3"
manifest-path = "crates/wolfppt-py/Cargo.toml"
python-source = "src"
module-name = "wolfppt.wolfppt_native"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
